<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview Cherupuzha River Rafting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../static/css/style.css" />
  <style>
    /* Inline widget styles from whatsapp_widget.html */
    .wa-widget {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .call-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      border-radius: 50%;
      border: 3.5px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.45), 0 0 0 1px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
    }
    .call-btn:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #7dd3fc 0%, #0369a1 100%);
      border-color: #ffffff;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.1);
    }
    .call-btn:focus-visible {
      outline: 3px solid #38bdf8;
      outline-offset: 3px;
    }
    .call-icon {
      fill: #ffffff;
      transition: fill 0.3s ease;
    }
    .wa-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      background-color: #25D366;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
    }
    .wa-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background-color: #ef4444;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
    }
    @media (max-width: 480px) {
      .wa-widget {
        bottom: 16px;
        right: 16px;
        gap: 10px;
      }
      .call-btn {
        width: 50px;
        height: 50px;
      }
      .call-btn svg {
        width: 24px;
        height: 24px;
      }
      .wa-btn {
        width: 54px;
        height: 54px;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand d-inline-flex align-items-center" href="#">
        <img src="../static/images/rafting-nav-icon.png" alt="Cherupuzha River Rafting Icon" class="navbar-icon me-2" />
        <span>Cherupuzha River Rafting</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#time-slots">Time Slots</a></li>
          <li class="nav-item"><a class="nav-link" href="#why-us">Why Choose Us</a></li>
          <li class="nav-item"><a class="nav-link" href="#gallery">Gallery</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero-section" id="home">
    <div class="container text-center text-white py-5">
      <h1 class="display-4 fw-bold mb-3 hero-title">
        <span class="hero-title-main">Cherupuzha River Rafting</span> <span class="hero-title-sub">Gate 1</span>
      </h1>
      <p class="lead mb-4">Experience the thrill of white water rapids surrounded by breathtaking mountain landscapes.</p>
      <div class="d-flex flex-column align-items-center gap-3">
        <a href="#instructions" class="btn btn-instructions btn-lg px-4 py-3" style="background-color: #f27508; color: white; border-radius: 30px;">
          Know Before You Go
        </a>
        <a href="#" class="btn btn-primary btn-lg px-5 py-3" style="border-radius: 30px;">
          Book Your Adventure
        </a>
      </div>
    </div>
  </header>

  <!-- Floating Widgets -->
  <div id="wa-widget" class="wa-widget">
    <a href="tel:+918877994476" id="call-btn" class="call-btn" aria-label="Call us at +91 8877994476">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" class="call-icon">
        <path d="M6.62 10.79a15.053 15.053 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </svg>
    </a>
    <button id="wa-btn" class="wa-btn" aria-label="Chat with us on WhatsApp">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="#fff" xmlns="http://www.w3.org/2000/svg" class="wa-icon">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.82 9.82 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
      </svg>
      <div class="wa-badge">1</div>
    </button>
  </div>
</body>
</html>
