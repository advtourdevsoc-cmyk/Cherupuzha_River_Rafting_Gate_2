<style>
  /* Floating Widgets Styles */
  .wa-widget {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9999;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* Floating Call Button */
  .call-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 58px;
    height: 58px;
    background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
    border-radius: 50%;
    border: 3.5px solid #ffffff;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(2, 132, 199, 0.45), 0 0 0 1px rgba(0, 0, 0, 0.08);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease, box-shadow 0.3s ease;
    text-decoration: none;
  }

  .call-btn:hover {
    transform: scale(1.08);
    background: linear-gradient(135deg, #7dd3fc 0%, #0369a1 100%);
    border-color: #ffffff;
    box-shadow: 0 6px 18px rgba(2, 132, 199, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.1);
  }

  .call-btn:focus-visible {
    outline: 3px solid #38bdf8;
    outline-offset: 3px;
  }

  .call-icon {
    fill: #ffffff;
    transition: fill 0.3s ease;
  }

  .call-tooltip {
    position: absolute;
    right: 75px;
    top: 50%;
    transform: translateY(-50%) translateX(10px);
    background-color: #fff;
    color: #1e293b;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    pointer-events: none;
  }

  .call-tooltip::after {
    content: '';
    position: absolute;
    top: 50%;
    right: -5px;
    transform: translateY(-50%);
    border-width: 5px 0 5px 5px;
    border-style: solid;
    border-color: transparent transparent transparent #fff;
  }

  .call-btn:hover .call-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateY(-50%) translateX(0);
  }

  /* Floating WhatsApp Button */
  .wa-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 60px;
    height: 60px;
    background-color: #25D366;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.3s ease;
  }

  .wa-btn:hover {
    transform: scale(1.08);
    background-color: #22c35e;
  }

  .wa-btn:focus-visible {
    outline: 3px solid #128C7E;
    outline-offset: 3px;
  }

  .wa-icon {
    z-index: 2;
  }

  /* Tooltip */
  .wa-tooltip {
    position: absolute;
    right: 75px;
    top: 50%;
    transform: translateY(-50%) translateX(10px);
    background-color: #fff;
    color: #333;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    pointer-events: none;
  }

  /* Tooltip Arrow */
  .wa-tooltip::after {
    content: '';
    position: absolute;
    top: 50%;
    right: -5px;
    transform: translateY(-50%);
    border-width: 5px 0 5px 5px;
    border-style: solid;
    border-color: transparent transparent transparent #fff;
  }

  .wa-btn:hover .wa-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateY(-50%) translateX(0);
  }

  /* Notification Badge */
  .wa-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    background-color: #ff3b30;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    height: 20px;
    width: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
    z-index: 3;
  }

  /* Pulse Animation */
  .wa-pulse {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background-color: #25D366;
    opacity: 0.6;
    z-index: 1;
    animation: wa-pulse-anim 2s infinite cubic-bezier(0.45, 0, 0.55, 1);
  }

  @keyframes wa-pulse-anim {
    0% {
      transform: scale(1);
      opacity: 0.6;
    }

    100% {
      transform: scale(1.6);
      opacity: 0;
    }
  }

  /* Expandable Panel */
  .wa-panel {
    position: absolute;
    bottom: 146px;
    right: 0;
    width: 300px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transform: translateY(20px) scale(0.95);
    transform-origin: bottom right;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .wa-panel.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }

  .wa-panel-header {
    background-color: #075E54;
    color: white;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .wa-panel-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 15px;
  }

  #wa-panel-close {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.8);
    font-size: 24px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    transition: color 0.2s;
  }

  #wa-panel-close:hover {
    color: white;
  }

  .wa-panel-body {
    padding: 20px 16px;
    background-image: url('data:image/svg+xml,%3Csvg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M0 0h20v20H0V0zm10 10l10 10H0L10 10z" fill="%23f0f2f5" fill-opacity="0.4" fill-rule="evenodd"/%3E%3C/svg%3E');
    background-color: #efeae2;
  }

  .wa-message {
    background: white;
    padding: 12px 14px;
    border-radius: 0 8px 8px 8px;
    font-size: 14px;
    color: #111b21;
    margin: 0;
    line-height: 1.4;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
    display: inline-block;
    position: relative;
  }

  .wa-message::before {
    content: '';
    position: absolute;
    top: 0;
    left: -8px;
    width: 0;
    height: 0;
    border-top: 0 solid transparent;
    border-right: 8px solid white;
    border-bottom: 8px solid transparent;
  }

  .wa-time {
    font-size: 11px;
    color: #667781;
    margin: 8px 0 0 0;
    text-align: right;
  }

  .wa-panel-footer {
    padding: 16px;
    background: white;
    text-align: center;
  }

  .wa-btn-start {
    display: inline-block;
    width: 100%;
    padding: 12px 0;
    background-color: #25D366;
    color: white;
    text-decoration: none;
    border-radius: 24px;
    font-weight: 600;
    font-size: 15px;
    transition: background-color 0.2s;
  }

  .wa-btn-start:hover {
    background-color: #128C7E;
  }

  /* Mobile Responsiveness */
  @media (max-width: 480px) {
    .wa-widget {
      bottom: 16px;
      right: 16px;
      gap: 10px;
    }

    .call-btn {
      width: 50px;
      height: 50px;
    }

    .call-btn svg {
      width: 24px;
      height: 24px;
    }

    .wa-btn {
      width: 54px;
      height: 54px;
    }

    .wa-panel {
      width: 280px;
      bottom: 130px;
    }

    .wa-tooltip,
    .call-tooltip {
      display: none;
      /* Hide tooltip on touch devices to avoid sticking */
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const waBtn = document.getElementById('wa-btn');
    const waPanel = document.getElementById('wa-panel');
    const waCloseBtn = document.getElementById('wa-panel-close');
    const waBadge = document.querySelector('.wa-badge');
    const waPulse = document.querySelector('.wa-pulse');

    // Toggle Panel
    function togglePanel() {
      const isOpen = waPanel.classList.contains('open');
      if (isOpen) {
        waPanel.classList.remove('open');
        waBtn.setAttribute('aria-expanded', 'false');
      } else {
        waPanel.classList.add('open');
        waBtn.setAttribute('aria-expanded', 'true');
        // Hide badge and pulse once user opens the panel
        if (waBadge) waBadge.style.display = 'none';
        if (waPulse) waPulse.style.display = 'none';
      }
    }

    // Click on floating button
    waBtn.addEventListener('click', togglePanel);

    // Click on close button
    waCloseBtn.addEventListener('click', function (e) {
      e.stopPropagation(); // prevent triggering waBtn click if bubbled
      togglePanel();
    });

    // Close panel when clicking outside
    document.addEventListener('click', function (e) {
      if (!document.getElementById('wa-widget').contains(e.target) && waPanel.classList.contains('open')) {
        togglePanel();
      }
    });

    // Close panel on Esc key
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && waPanel.classList.contains('open')) {
        togglePanel();
        waBtn.focus();
      }
    });
  });
</script>
